<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- REACT -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PDF LIBRARIES - WITH FALLBACK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .float-animation { animation: float 4s ease-in-out infinite; }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }

        .btn-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
        }

        input:focus, select:focus {
            outline: none;
            border-color: #10b981 !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================ */
        /* PDF CONTAINER - OPTIMIZED FOR CAPTURE */
        /* ============================================ */
        #pdf-container {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 210mm;
            background: white !important;
            color: #333 !important;
            font-family: 'Arial', sans-serif !important;
            z-index: -9999;
            pointer-events: none;
        }

        /* PDF STYLES */
        .pdf-header {
            position: relative;
            height: 120px;
            background: white;
            border-bottom: 3px solid #ef4444;
            overflow: hidden;
        }

        .header-circle-blue {
            position: absolute;
            top: -60px;
            right: -40px;
            width: 200px;
            height: 200px;
            background: #3B82F6;
            border-radius: 50%;
        }

        .header-circle-purple {
            position: absolute;
            top: 20px;
            right: 100px;
            width: 100px;
            height: 100px;
            background: #4F46E5;
            border-radius: 50%;
            opacity: 0.9;
        }

        .client-info-strip {
            background: linear-gradient(90deg, #4F46E5, #2563eb);
            color: white;
            padding: 12px 30px;
            margin: 15px 30px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .star-badge {
            width: 80px;
            height: 80px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            margin: 0 auto;
        }

        .star-green { background: #22c55e; }
        .star-red { background: #ef4444; }
        .star-orange { background: #f59e0b; }
        .star-lightgreen { background: #84cc16; }

        .blue-bar {
            background: #3B82F6;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        .grid-pdf {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin: 10px 30px;
            border-top: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
        }

        .grid-item-pdf {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px dashed #cbd5e1;
            border-right: 1px dashed #cbd5e1;
        }

        .grid-item-pdf:nth-child(even) { border-right: none; }

        .status-high { color: #ef4444; font-weight: bold; }
        .status-low { color: #f59e0b; font-weight: bold; }
        .status-ok { color: #22c55e; font-weight: bold; }

        .coach-footer-pdf {
            background: #FFD700;
            padding: 12px 25px;
            margin: 15px 30px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* LOADING OVERLAY FOR PDF */
        .pdf-loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .pdf-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

            { name: 'Flax Oil Capsules', use: 'Omega-3 Heart Health', price: '₹756', emoji: '❤️', color: 'from-red-400 to-rose-600' },
            { name: 'Veslim Shake', use: 'Meal Replacement', price: '₹2327', emoji: '🥤', color: 'from-purple-400 to-violet-600' },
            { name: 'Vestige Noni', use: 'Metabolism Boost', price: '₹701', emoji: '🧬', color: 'from-blue-400 to-cyan-600' },
            { name: 'Calcium Supplement', use: 'Strong Bones', price: '₹314', emoji: '🦴', color: 'from-yellow-400 to-orange-600' },
            { name: 'Glucosamine', use: 'Joint Pain Relief', price: '₹1019', emoji: '🦵', color: 'from-pink-400 to-rose-600' }
        ];

        const testimonials = [
            { name: 'Priya Sharma', result: 'Lost 8kg in 2 Months', text: 'Saroj Ma\'am ki diet aur yoga ne meri life badal di!', emoji: '👩' },
            { name: 'Rahul Verma', result: 'Speed Increased', text: 'Best coach for athletes. Sprint speed badh gayi!', emoji: '👨' },

        const getStatus = (val, min, max) => {

        // ========== NAVBAR ==========
        const Navbar = () => (
            <nav className="fixed w-full z-50 glass py-4 px-6">
                <div className="max-w-7xl mx-auto flex justify-between items-center">
                    <div className="text-2xl font-bold gradient-text">SAROJ<span className="text-white">FIT</span></div>
                    <div className="hidden md:flex gap-6 text-sm">
                        <a href="#services" className="hover:text-emerald-400 transition">Services</a>
                        <a href="#tools" className="hover:text-emerald-400 transition">AI Tools</a>

        // ========== HERO ==========
        const Hero = () => (
            <header className="min-h-screen pt-24 pb-16 px-6 flex items-center relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-b from-emerald-900/20 via-transparent to-purple-900/20"></div>
                <div className="absolute top-20 left-10 w-32 h-32 bg-emerald-500/20 rounded-full blur-3xl float-animation"></div>
                <div className="absolute bottom-20 right-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl float-animation" style={{animationDelay: '2s'}}></div>

                <div className="max-w-7xl mx-auto text-center relative z-10 fade-in">
                    <span className="inline-block px-6 py-2 rounded-full glass text-emerald-300 text-xs font-bold mb-6 uppercase tracking-wider">
                        🏆 Certified Coach & Ayurveda Expert
                    </span>

                    <h1 className="text-5xl md:text-7xl font-black mb-6 leading-tight">
                        Train Like a<br/><span className="gradient-text">Champion</span>
                    </h1>

                    <p className="text-lg text-white/70 mb-10 max-w-2xl mx-auto">
                        Transform your body & mind with expert weight loss coaching, authentic yoga sessions & premium Ayurvedic guidance by <strong className="text-emerald-400">Saroj</strong>
                    </p>

                    <div className="flex flex-col sm:flex-row gap-4 justify-center mb-16">
                        <a href="https://wa.me/919217225060" className="bg-gradient-to-r from-emerald-500 to-green-600 px-8 py-4 rounded-full font-bold hover:scale-105 transition-transform shadow-lg inline-flex items-center justify-center gap-2">
                            <i className="fab fa-whatsapp text-xl"></i> Chat on WhatsApp
                        </a>
                        <a href="#tools" className="glass px-8 py-4 rounded-full font-bold hover:bg-white/10 transition-all inline-flex items-center justify-center gap-2">

                        </a>

                    <div className="grid grid-cols-3 gap-6 max-w-2xl mx-auto">
                        <div className="glass p-6 rounded-2xl">
                            <div className="text-3xl font-black gradient-text">500+</div>

                        </div>
                        <div className="glass p-6 rounded-2xl">
                            <div className="text-3xl font-black gradient-text">10+</div>

                        </div>
                        <div className="glass p-6 rounded-2xl">
                            <div className="text-3xl font-black gradient-text">98%</div>
                            <div className="text-sm text-white/60">Success Rate</div>
                        </div>

            </header>
        );

        // ========== SERVICES ==========
        const Services = () => (
            <section id="services" className="py-20 px-6">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <h2 className="text-4xl md:text-5xl font-black mb-4 gradient-text">Premium Services</h2>

                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {services.map((service, i) => (
                            <div key={i} className="glass p-8 rounded-2xl hover:border-emerald-500/50 transition-all hover:-translate-y-2 duration-300">
                                <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${service.color} flex items-center justify-center mb-4`}>

                        ))}

        );

        // ========== DIET PLANNER ==========
        const DietPlanner = () => {
            const [step, setStep] = useState(1);
            const [loading, setLoading] = useState(false);
            const [form, setForm] = useState({ name: '', weight: '', height: '', goal: 'Weight Loss', type: 'Vegetarian' });
            const [plan, setPlan] = useState(null);

            const generate = () => {
                if (!form.name || !form.weight || !form.height) return alert('Please fill all details!');
                setLoading(true);

                setTimeout(() => {
                    let diet = {};
                    if (form.goal === 'Weight Loss') {
                        diet = {
                            morning: '🌅 Warm Water + Lemon + Honey',
                            breakfast: form.type === 'Vegetarian' ? '🥣 Oats Porridge + Almonds' : '🍳 Egg Whites + Toast',
                            lunch: '🍽️ Multigrain Roti + Veg + Salad',
                            snack: '☕ Green Tea + Roasted Makhana',
                            dinner: '🥗 Soup + Papaya (No carbs after 8PM)'
                        };
                    } else if (form.goal === 'Muscle Gain') {
                        diet = {
                            morning: '💪 Soaked Chana + Banana + Milk',
                            breakfast: '🥪 Paneer Paratha / Omelet',
                            lunch: '🍚 Rice + Dal + Roti + Curd',
                            snack: '🥤 Protein Shake',
                            dinner: '🍗 Roti + Paneer / Chicken'
                        };
                    } else {
                        diet = {
                            morning: '🌰 Warm Water + Almonds',
                            breakfast: '🍲 Poha / Idli',
                            lunch: '🥘 Roti + Sabzi + Dal',
                            snack: '🍎 Fruit Salad',
                            dinner: '🍛 Khichdi'
                        };
                    }

                    setPlan(diet);
                    setLoading(false);
                    setStep(2);
                }, 1500);
            };

            return (
                <div className="glass p-8 rounded-3xl">
                    <div className="text-center mb-8">
                        <div className="w-14 h-14 bg-gradient-to-br from-emerald-400 to-green-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                            <i className="fas fa-robot text-2xl text-white"></i>
                        </div>
                        <h2 className="text-3xl font-black gradient-text mb-2">AI Diet Planner</h2>
                        <p className="text-white/60 text-sm">Personalized nutrition plan</p>
                    </div>

                    {step === 1 && (
                        <div className="space-y-4">
                            <input type="text" placeholder="Your Name" value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} className="w-full glass bg-white/5 p-4 rounded-xl text-white placeholder-white/40" />
                            <div className="grid grid-cols-2 gap-4">
                                <input type="number" placeholder="Weight (kg)" value={form.weight} onChange={(e) => setForm({...form, weight: e.target.value})} className="w-full glass bg-white/5 p-4 rounded-xl text-white placeholder-white/40" />
                                <input type="number" placeholder="Height (cm)" value={form.height} onChange={(e) => setForm({...form, height: e.target.value})} className="w-full glass bg-white/5 p-4 rounded-xl text-white placeholder-white/40" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <select value={form.goal} onChange={(e) => setForm({...form, goal: e.target.value})} className="w-full glass bg-white/5 p-4 rounded-xl text-white">
                                    <option value="Weight Loss">Weight Loss</option>
                                    <option value="Muscle Gain">Muscle Gain</option>
                                    <option value="Stay Fit">Stay Fit</option>
                                </select>
                                <select value={form.type} onChange={(e) => setForm({...form, type: e.target.value})} className="w-full glass bg-white/5 p-4 rounded-xl text-white">
                                    <option value="Vegetarian">Vegetarian</option>
                                    <option value="Non-Veg">Non-Vegetarian</option>
                                </select>
                            </div>
                            
                            <button onClick={generate} disabled={loading} className="w-full bg-gradient-to-r from-emerald-500 to-green-600 py-4 rounded-xl font-bold disabled:opacity-50 mt-4">
                                {loading ? <span className="flex items-center justify-center gap-2"><div className="loader"></div> Generating...</span> : 'Get Your Plan 🎯'}
                            </button>
                        </div>
                    )}

                    {step === 2 && plan && (
                        <div className="glass bg-white/5 p-6 rounded-2xl fade-in">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                                <h3 className="text-xl font-bold gradient-text">Your Daily Plan</h3>
                                <span className="text-sm text-white/60">For {form.name}</span>
                            </div>

                            {Object.entries(plan).map(([key, value]) => (
                                <div key={key} className="mb-4 p-4 glass bg-white/5 rounded-xl">
                                    <span className="text-emerald-400 font-bold text-sm uppercase block mb-1">{key}</span>
                                    <span className="text-white/80">{value}</span>
                                </div>
                            ))}

                            <button onClick={() => {setStep(1); setPlan(null);}} className="w-full mt-6 py-3 glass rounded-xl text-sm text-white/60 hover:text-emerald-400 transition">Create New Plan</button>
                        </div>
                    )}
                </div>
            );
        };

        // ========== BMI CALCULATOR WITH FIXED PDF ==========
        const BMICalculator = () => {
            const [data, setData] = useState({ name: '', age: '', gender: 'Male', weight: '', height: '' });
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [pdfLoading, setPdfLoading] = useState(false);
            const [pdfError, setPdfError] = useState('');

            const calculate = () => {
                if (!data.name || !data.weight || !data.height || !data.age) return alert('Please fill all details!');
                setLoading(true);

                setTimeout(() => {
                    const isMale = data.gender === 'Male';
                    const gender = isMale ? 'male' : 'female';
                    const ranges = RANGES[gender];
                    
                    const h = data.height / 100;
                    const bmi = (data.weight / (h * h)).toFixed(1);
                    const age = parseInt(data.age);

                    let fat = isMale 
                        ? (1.20 * bmi + 0.23 * age - 16.2).toFixed(1)
                        : (1.20 * bmi + 0.23 * age - 5.4).toFixed(1);
                    if (fat < 3) fat = 3;

                    const muscle = isMale ? (data.weight * 0.72).toFixed(1) : (data.weight * 0.62).toFixed(1);
                    const skelMuscle = isMale ? (muscle * 0.57).toFixed(1) : (muscle * 0.60).toFixed(1);
                    const bone = isMale ? (data.weight * 0.038).toFixed(2) : (data.weight * 0.04).toFixed(2);
                    const water = isMale ? (65 - fat * 0.40).toFixed(1) : (60 - fat * 0.40).toFixed(1);
                    
                    const bmr = isMale
                        ? Math.round(66.5 + 13.75*data.weight + 5.003*data.height - 6.775*age)
                        : Math.round(655.1 + 9.563*data.weight + 1.850*data.height - 4.676*age);

                    let vFat;
                    if (bmi > 30) vFat = Math.min(12 + Math.round((bmi-30)*0.5), 20);
                    else if (bmi > 25) vFat = Math.round(7 + (bmi-25));
                    else if (bmi > 22) vFat = Math.round(4 + (bmi-22));
                    else vFat = Math.round(2 + bmi * 0.1);

                    let metAge = bmi > 25 ? age + 3 : Math.max(age - 2, 18);
                    const cat = bmi < 18.5 ? 'Underweight' : (bmi < 25 ? 'Normal' : (bmi < 30 ? 'Overweight' : 'Obese'));
                    const ideal = (22 * h * h).toFixed(1);
                    const weightMin = (18.5 * h * h).toFixed(1);
                    const weightMax = (24.9 * h * h).toFixed(1);
                    const protein = Math.max(5, (100 - fat - water - (bone/data.weight*100))).toFixed(1);

                    setResult({
                        ...data,
                        bmi, fat, muscle, skelMuscle, bone, water, bmr, metAge, vFat, cat,
                        ideal, weightMin, weightMax, protein,
                        ranges,
                        fatStatus: getStatus(fat, ranges.fat.min, ranges.fat.max),
                        muscleStatus: getStatus(skelMuscle, ranges.muscle.min, ranges.muscle.max),
                        waterStatus: getStatus(water, ranges.water.min, ranges.water.max),
                        vFatStatus: getStatus(vFat, ranges.vFat.min, ranges.vFat.max),
                        weightStatus: getStatus(data.weight, weightMin, weightMax)
                    });

                    setLoading(false);
                }, 1500);
            };

            // ============================================
            // 📄 FIXED PDF DOWNLOAD FUNCTION
            // ============================================
            const downloadPDF = async () => {
                setPdfLoading(true);
                setPdfError('');

                try {
                    // CHECK IF LIBRARIES ARE LOADED
                    if (typeof html2canvas === 'undefined') {
                        throw new Error('html2canvas library not loaded. Please check internet connection.');
                    }

                    if (typeof window.jspdf === 'undefined') {
                        throw new Error('jsPDF library not loaded. Please check internet connection.');
                    }

                    console.log('✅ Libraries loaded successfully');

                    // GET CONTAINER
                    const container = document.getElementById('pdf-container');
                    
                    if (!container) {
                        throw new Error('PDF container not found!');
                    }

                    console.log('📄 Container found, starting capture...');

                    // MAKE CONTAINER VISIBLE TEMPORARILY
                    container.style.position = 'absolute';
                    container.style.left = '0';
                    container.style.top = '0';
                    container.style.zIndex = '-9999';
                    container.style.visibility = 'visible';
                    container.style.opacity = '1';

                    // SMALL DELAY TO ENSURE RENDER
                    await new Promise(resolve => setTimeout(resolve, 100));

                    // CAPTURE WITH HTML2CANVAS
                    console.log('📸 Capturing canvas...');
